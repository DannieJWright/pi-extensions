          - extensions/ui-capture/spec.test.ts
          - extensions/ui-capture/spec.ts
          - extensions/ui-capture/tools.test.ts
          - skills/before-after-capture/skill.test.mjs
      tests:
        - extensions/ui-capture/spec.test.ts
        - extensions/ui-capture/tools.test.ts
        - extensions/ui-capture/driver.test.ts
        - skills/before-after-capture/skill.test.mjs
      limitations: []
      summary: "Added validateConditions and parseViewport in spec.ts, called from CaptureService.run and check after input() and before directory()/savePhase; removed driver condition checks; added spec, tools, driver and skill tests."
      commits:
