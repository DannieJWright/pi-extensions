ledger:
  description: "Before/after capture tooling and feature-ledger skill fixes from a live session run: capture driver sandbox fallback, one condition gate, argument shapes, claim token shape, role routing, and orchestrator scope. Source plan: plan/2026-11-27_capture-and-ledger-fixes.md."
  workspace: .
  branch: fix-snapshot-permission-fixes
  max_failed_reviews: 5
  validation_scripts:
    - just test
  features:
    - id: ui-capture-sandbox-fallback
      status: done
      goal: "Decision 1 and section A of plan/2026-11-27_capture-and-ledger-fixes.md. Replace the single-pattern test in the retry block of createDriver (extensions/ui-capture/driver.ts, retry at about :156-160, pattern at :158) with a helper that matches /\\bEPERM\\b/i on the stringified error, an object error with code === \"EPERM\" (read behind an object check), and /no usable sandbox|sandboxing failed|operation not permitted/i. Keep the fallback launch options. Give the second launch a handler that throws a combined error built with the existing private errorText (driver.ts:47, which applies redactUrl), in the style of combineCleanupErrors (driver.ts:48-50). The plan cites driver.ts:51 for errorText; the function is at :47."
      short_goal: "The capture driver retries Chromium launch without its sandbox for every sandbox-restricted host error, and reports both errors when the retry also fails."
      review: true
      failed_reviews: 0
      findings: []
      acceptance_criteria:
        - "The driver retries once with { chromiumSandbox: false, args: [\"--no-sandbox\"] } when the first launch error matches /\\bEPERM\\b/i, matches /no usable sandbox|sandboxing failed|operation not permitted/i, or is an object with code === \"EPERM\" whose message lacks the word."
        - "A null, undefined or other non-object rejection does not throw a TypeError; the original failure is rethrown without a retry."
        - "A value that stringifies to \"[object Object]\" with no code, and an \"Executable doesn't exist\" error, do not retry: launch is called exactly once."
        - Every retry path calls launch exactly twice.
        - "When the retry also fails, the thrown message is exactly `${errorText(first)}; sandbox fallback failed: ${errorText(second)}`, with URLs redacted through errorText."
        - "When the first launch fails and the second succeeds, closing the driver closes the surviving context and browser (this replaces the vacuous browser-leak case)."
        - The existing EPERM-only test still passes unchanged.
        - "No spec field, environment variable or sidecar field records which sandbox mode was used."
        - No third copy of errorText is added.
      constraints:
        - No new dependencies.
        - "Tests use the fake Playwright only; no real browser and no access to HOME."
        - "Tests state which cases guard against over-broad matching (\"[object Object]\", \"Executable doesn't exist\" pass on pre-fix code) and which case fails before the change (code === \"EPERM\" with a message lacking the word)."
        - "Drop the redundant lowercase-text case; String(error) already covers it."
      files:
        in:
          - extensions/ui-capture/driver.ts
          - extensions/ui-capture/driver.test.ts
        out:
          - extensions/ui-capture/driver.test.ts
          - extensions/ui-capture/driver.ts
      tests:
        - extensions/ui-capture/driver.test.ts
      limitations: []
      summary: "Added sandboxRestricted helper (EPERM text, code EPERM on objects, sandbox messages); null/undefined rethrown; failed fallback throws combined errorText message; tests added."
      commits:
        start: d5b6617e176988885721bd0c9110660ec88a3ac6
        end: aa6a7088f5fa003016c7dd2c62138dc388d351fb
        submissions:
          - aa6a7088f5fa003016c7dd2c62138dc388d351fb
    - id: ui-capture-condition-gate
      status: done
      goal: "Decision 2 and section B of plan/2026-11-27_capture-and-ledger-fixes.md. parseSpec stays structural. Add validateConditions(conditions: Record<string, unknown>): void to extensions/ui-capture/spec.ts; it throws Error, does not normalize values and ignores unknown keys (tests use labels, base_url and fixture). Call it in CaptureService.run and CaptureService.check (extensions/ui-capture/capture.ts, run() at about :78 with input and directory in one statement at :81; check() at about :73-75) after input() and before directory() and savePhase. Do not call it from input() or parseSpec, because input() also serves server() start|stop|status|logs; capture_server start stays ungated as well. Remove the inline condition checks from the driver (driver.ts:73-74 entry in PlaywrightDriver.open, :167-174, and the clock check at :182-186) and move viewport parsing to one exported parseViewport in spec.ts that both validateConditions and createDriver use. smoke.test.ts and concurrency-fixture.ts go through CaptureService.run, so the new gate covers them with no edit."
      short_goal: "Validate capture condition values once, through an exported validateConditions that capture_run and capture_check call before any launch, artifact directory or sidecar write."
      review: true
      failed_reviews: 0
      findings: []
      acceptance_criteria:
        - "spec.ts exports validateConditions, which rejects invalid theme (including `default`), locale, permissions, storage, theme_storage, clock, entry and viewport values, and ignores unknown keys."
        - "Rejection messages are kept verbatim from the driver: `conditions.theme must be light or dark`, `conditions.locale must be a string`, `conditions.permissions must be an array of strings`, `conditions.storage values must be strings`, `conditions.storage must be a mapping`, `theme_storage.key requires a theme and a non-empty key`, `conditions.viewport must be WIDTHxHEIGHT`, `conditions.entry must be a string`, `conditions.clock must be a valid date`."
        - "Clock rule: a non-empty string that Date parses, or a finite number (epoch milliseconds), is accepted; boolean, null, array, object, empty string and an unparseable value are rejected. The driver keeps new Date(clock) without normalization."
        - "CaptureService.run and CaptureService.check call validateConditions after input() and before directory() and savePhase; input() and parseSpec do not call it."
        - "capture_server with start, stop, status and logs still succeeds on a spec with an invalid condition."
        - "For `theme default`, capture_run before, capture_run after and capture_check reject with the identical message, launch is called zero times, and no artifact directory, sidecar or image exists afterward."
        - "A valid earlier phase survives a later run rejected for a bad condition, because validation precedes savePhase."
        - "createDriver no longer contains condition checks; viewport parsing lives in one shared function."
        - "parseSpec output is unchanged for existing specs; conditions stay raw and spec.hash is identical."
        - The before-after-capture SKILL.md example spec passes parseSpec and validateConditions.
      constraints:
        - "Do not normalize condition values onto the parsed spec; spec_hash and stored sidecar conditions stay raw."
        - Do not edit smoke.test.ts or concurrency-fixture.ts.
        - "A hand-built CaptureSpec bypasses validation; condition tests go through parseSpec plus validateConditions."
        - "Tests use temporary directories, the fake runtime and the fake Playwright only."
        - Theme stays restricted to light and dark.
