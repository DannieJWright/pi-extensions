        - "The ledger.ts:843 message names new_findings[n], the required fields, the allowed severities and a preview of the received value."
        - "badShapeProblem keeps its current text, and the existing assertions on it still pass (reviewer.test.ts about :425, :429, :432; worker.test.ts about :377-380)."
        - A rejected submit leaves the ledger file and the claim unchanged.
        - lib/args.ts behaviour is unchanged.
      constraints:
        - "Keep gate messages terse; do not mirror documentation wording."
        - "Tests reach ledger.ts:841 through callUnvalidated (reviewer.test.ts:26) or a direct submitReview call, because Pi's validator rejects a non-array earlier."
        - "Valid bracketed JSON strings still decode (covered at reviewer.test.ts:451 and :475, worker.test.ts:386)."
      files:
