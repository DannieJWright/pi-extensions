        - id: finding-bc78f12b-af33-423a-ab22-c3dcc5ad0cda
          status: closed
          severity: minor
          details: "extensions/feature-ledger/ledger.ts:843 now throws badShapeProblem(`new_findings[${index}]`, `an object with non-empty details and rationale, severity ${FINDING_SEVERITIES.join(\", \")}, and optional required_checks`, finding). required_checks is not optional: the tool schema at extensions/feature-ledger/index.ts:78 lists it in `required: [\"details\", \"rationale\", \"severity\", \"required_checks\"]`, ledger.ts:844 rejects a finding whose required_checks is undefined (`!Array.isArray(finding.required_checks)`), NewFinding (ledger.ts:756) picks it as a required field, and the README (README.md:31) lists it among the finding object fields. An agent whose finding has a bad severity and no required_checks is told required_checks is optional, omits it, and fails again at :844. Smallest fix: change the expected text to name required_checks as required, e.g. `an object with non-empty details and rationale, severity critical, major, minor, nit and a required_checks list` (keep it terse), and update the regex at extensions/feature-ledger/reviewer.test.ts:438 accordingly."
          rationale: "Acceptance criterion 2 requires the :843 message to name the required fields; it currently misstates one of them as optional, contradicting the schema and the :844 check, so the message misleads the caller it is meant to correct."
          required_checks:
            - "Read extensions/feature-ledger/ledger.ts:843 and confirm the expected-shape text names required_checks as required (no word 'optional') alongside details, rationale and the allowed severities."
            - "Confirm the new_findings[0] assertion in extensions/feature-ledger/reviewer.test.ts matches the updated text and that badShapeProblem (ledger.ts:175-177) is unchanged."
            - "Run just test (via just_test) and confirm feature-ledger test passes with fail=0."
          first_found_iteration: 0
