    - id: ui-capture-skill-agent
      status: done
      goal: >
        Rewrite the before-after-capture skill around the tools, ship the
        ui-worker subagent, and route before/after ledger items to it.
        Sections "Agent and ledger", "Skill rewrite", and "Files" (SKILL.md,
        scripts removal, agents/ui-worker.md, package.json, orchestrator
        workflow, README.md) of plan/2026-11-21_ui-capture-tooling.md.
        Existing seams: ledger.ts nextItem and listItems omit acceptance
        criteria; ledger_start mutates status. The orchestrator workflow
        validates a strict implementor JSON result and resumes the original
        agent only when its identity is known and resumption is supported;
        otherwise it stops and reports. justfile skills test fails when no
        skill tests exist. After all items, the plan requires separate
        target-project dry runs with recorded evidence.
      short_goal: >
        Skill rewrite, ui-worker agent, ledger routing, and old script
        removal.
      acceptance_criteria:
        - 'skills/before-after-capture/SKILL.md names only the capture tools; it names no script, CLI, or recipe from this repository.'
        - 'The skill flow is write the spec, capture_run before, implement, capture_run after, look at the returned images, capture_check.'
        - 'Keep existing evidence rules: matching conditions, rendered region, runner produces the changed state rather than assuming it, DOM attribute alone is not evidence, cleanup before merge, tracked non-ignored artifacts, spec beside the pair, deterministic fixtures, and the same elements in view. Add: one spec per pair; no build or e2e run of the same package while its capture server runs; reuse a user server with url; never delete another server''s lock.'
        - 'skills/before-after-capture/scripts/ is removed; applicable runner and YAML tests are covered in the extension. Add skills/before-after-capture/skill.test.mjs so the existing just skills test and just test have a real remaining test and pass.'
        - 'agents/ui-worker.md retains the worker persona and writer role, explicitly enables or selects capture and ledger skills, and makes capture, ledger start/submit, and dynamically generated project just tools available with their providers. Test the supported tool-selection strategy and installed-package path resolution; a literal just_* is not an agent allowlist wildcard.'
