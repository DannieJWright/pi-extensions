      short_goal: >
        Register the three capture tools, session shutdown hook, CLI, and
        README.
      acceptance_criteria:
        - 'extensions/ui-capture/index.ts registers capture_server (action start, stop, status, logs; spec; optional tail), capture_run (spec, phase before or after, optional build label), and capture_check (spec, answers, optional force).'
        - 'capture_run ensures the server, applies the browser hydration gate, runs the steps, writes the PNGs to <artifacts>/<feature>/<subphase>/<phase>[-<name>].png, and merges the sidecar; compute diff and condition match only for two successful current phases.'
        - 'capture_run returns compact text and inline images according to the approved screenshot-selection contract; it cannot present stale PNGs or approvals as current.'
