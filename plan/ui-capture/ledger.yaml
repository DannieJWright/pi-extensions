      limitations:
        - 'Detached launcher mode remains unavailable unless the launcher provides verified identity-scoped control; the real-browser smoke test remains opt-in and was not run locally.'
        - The existing host supervisor has a rare pre-save ownership-verification cleanup limitation recorded by the prior server safety work.
      summary: >
