        - 'capture_check refuses missing, failed, incomplete, or stale evidence and any mismatch between the current spec hash and either phase; a re-capture invalidates prior diff and pair_check.'
        - 'On session_shutdown the extension stops the servers it started, except keep true.'
        - 'extensions/ui-capture/cli.ts uses the same modules and provides cross-invocation server start/status/logs/stop using a persistent supervisor or verified ownership record. Test separate invocations, stale ownership, process identity reuse, shutdown, and keep behavior.'
        - 'extensions/ui-capture/README.md documents the tools, the spec format, ~/.pi/agent/ui-capture.jsonc, the CLI, and the permission entry "capture_*" allow.'
